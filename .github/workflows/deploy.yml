name: Deploy backend to Vercel

# CI/CD for the Contest Hall *backend* (collegebeta-api).
#
# The FRONTEND (collegebeta) deploys automatically through Vercel's Git
# integration (Root Directory = frontend, framework = Vite), so it is
# deliberately NOT deployed here — doing so would double-deploy and race the
# Git build, which is exactly what previously broke production.
#
# The backend still deploys from CI because it needs database migrations and
# static-asset collection to run *before* the new function goes live, which a
# plain Git deploy does not do.
#
# Required repository secrets:
#   VERCEL_TOKEN  - a Vercel access token (https://vercel.com/account/settings/tokens)
#   DATABASE_URL  - the Neon *unpooled* connection string (for migrations)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_pRQSv6sGiVAKmiGeDWtlW1Nm

jobs:
  backend:
    name: Migrate + deploy backend
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: prj_bUtAgDqlKQyLmckiB5WfyOruTJfw
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Collect static assets (WhiteNoise manifest for the admin)
        working-directory: backend
        env:
          ENVIRONMENT: production
          DJANGO_SECRET_KEY: ci-build-placeholder-not-used-at-runtime
        run: python manage.py collectstatic --noinput

      - name: Apply migrations to Neon
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python manage.py migrate --noinput

      - name: Deploy backend to Vercel (production)
        if: ${{ env.VERCEL_TOKEN != '' }}
        working-directory: backend
        run: |
          npm install -g vercel@latest
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
